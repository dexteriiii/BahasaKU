<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BahasaKu - Kamus Kosakata</title>
    <style>
        /* === CSS STYLING === */
        :root {
            --primary: #9b51e0; 
            --primary-light: #f3e8ff;
            --success: #7CBA41;
            --bg-color: #e0e5ec;
            --text-dark: #333333;
            --text-gray: #828282;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #app { background-color: white; width: 100%; max-width: 900px; height: 100vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        
        .header { display: flex; align-items: center; gap: 15px; padding: 30px 20px 10px; }
        .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-dark); font-weight: bold;}
        h1 { font-size: 24px; color: var(--text-dark); flex: 1; text-align: left;}

        /* Search Bar & Stats */
        .top-section { padding: 0 20px 20px; border-bottom: 2px solid #f0f0f0; }
        .stats-badge { background-color: var(--primary-light); color: var(--primary); padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .search-container { display: flex; gap: 10px; }
        .search-input { flex: 1; padding: 15px 20px; font-size: 16px; border: 2px solid #E0E0E0; border-radius: 15px; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: var(--primary); }
        .btn-search { background-color: var(--primary); color: white; border: none; padding: 0 25px; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-search:hover { opacity: 0.9; }

        /* Scrollable Area */
        .content-scroll { flex: 1; overflow-y: auto; padding: 20px; background-color: #fafafa;}

        /* Result Area (Modal Style Inline) */
        #result-container { display: none; flex-direction: column; gap: 20px; animation: fadeIn 0.4s ease; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); margin-bottom: 30px; border: 2px solid var(--primary); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .word-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        .word-title { font-size: 32px; color: var(--text-dark); text-transform: capitalize; margin-bottom: 5px;}
        .phonetic { color: var(--text-gray); font-size: 18px; }
        .btn-audio { background-color: var(--primary-light); color: var(--primary); border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 28px; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .btn-audio:hover { background-color: var(--primary); color: white; transform: scale(1.05); }

        .translation-box { background-color: #E8F5E9; border-left: 5px solid var(--success); padding: 15px 20px; border-radius: 10px; }
        .translation-title { font-size: 13px; color: #2E7D32; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .translation-text { font-size: 20px; color: var(--text-dark); font-weight: bold; text-transform: capitalize; }

        .meaning-section { margin-top: 10px; }
        .part-of-speech { font-size: 16px; font-weight: bold; color: var(--primary); margin-bottom: 10px; font-style: italic; border-bottom: 1px dashed #ccc; display: inline-block; padding-bottom: 5px;}
        .definition-item { background: #f9f9f9; padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #eee;}
        .def-text { font-size: 15px; color: var(--text-dark); margin-bottom: 5px; }
        .def-example { font-size: 14px; color: var(--text-gray); font-style: italic; border-left: 3px solid #ccc; padding-left: 10px; }

        .btn-close-result { background: #f1f1f1; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; color: var(--text-dark); }
        .btn-close-result:hover { background: #e2e2e2; }
        .example-translation { margin-top: 8px; color: var(--text-dark); line-height: 1.5; }

        /* A-Z Dictionary Grid */
        .dictionary-wrapper { display: flex; flex-direction: column; gap: 30px; }
        .letter-group { display: flex; flex-direction: column; gap: 15px; }
        .letter-title { font-size: 28px; font-weight: bold; color: var(--text-dark); border-bottom: 3px solid var(--primary); padding-bottom: 5px; display: inline-block; width: fit-content; }
        .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        
        .word-box { background: white; border: 2px solid #E0E0E0; padding: 12px 10px; text-align: center; border-radius: 12px; cursor: pointer; transition: 0.2s; font-weight: bold; color: var(--text-dark); box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .word-box:hover { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(155, 81, 224, 0.3); }

        /* Loader */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (min-width: 768px) { #app { border-radius: 20px; height: 95vh; margin: 20px; } .word-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">
            <button class="back-btn" onclick="location.href='index.html#dashboard'">❮</button>
            <h1>Kamus Pintar 📖</h1>
        </div>

        <div class="top-section">
            <div id="stats-badge" class="stats-badge">Memuat kosakata...</div>
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Ketik kata bahasa Inggris apapun...">
                <button class="btn-search" onclick="triggerSearch()">Cari</button>
            </div>
        </div>

        <div class="content-scroll" id="scroll-area">
            
            <div id="loading" class="loader"></div>

            <!-- Area Hasil Pencarian API -->
            <div id="result-container">
                <div class="word-header">
                    <div>
                        <h2 id="word-title" class="word-title">Hello</h2>
                        <p id="word-phonetic" class="phonetic">/həˈləʊ/</p>
                    </div>
                    <button id="btn-audio" class="btn-audio" onclick="playAudio()" style="display: none;" title="Dengarkan Native Speaker">🔊</button>
                </div>

                <div class="translation-box">
                    <div class="translation-title">Terjemahan Bahasa Indonesia</div>
                    <div id="word-translation" class="translation-text">Halo</div>
                </div>

                <div id="meanings-container" class="meaning-section">
                    <!-- Definisi akan di-generate oleh JavaScript di sini -->
                </div>

                <button class="btn-close-result" onclick="closeResult()">Tutup Hasil</button>
            </div>

            <!-- Kotak Kotak Kosakata A-Z -->
            <div id="dictionary-wrapper" class="dictionary-wrapper">
                <!-- Di-generate otomatis oleh JavaScript -->
            </div>
            
            <div id="empty-msg" style="display: none; text-align: center; color: var(--text-gray); margin-top: 30px;">
                Kata tidak ditemukan di list kotak. <br><strong>Tekan tombol "Cari" untuk mencari secara online ke database global!</strong>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // DATABASE LOKAL KOSAKATA 
        // =========================================================================
        const localWordBank = [

            "ago", "agree", "agreement", "ahead", "air", "airport", "baby", "back", "backward", "bad", "badminton", "bag",
            "ball", "banana", "bank", "bar", "base", "baseball", "basketball", "bathroom", "battery", "battle", "beach", "bear",
            "beat", "beautiful", "because", "become", "bed", "bedroom", "bee", "before", "begin", "behavior", "behind", "belief",
            "cake", "call", "calm", "camera", "campaign", "cancer", "candidate", "capital", "car", "card", "care", "career",
            "carry", "case", "cat", "catch", "cause", "cell", "center", "central", "century", "certain", "certainly", "chair",
            "chalk", "challenge", "chance", "change", "character", "charge", "dance", "dangerous", "dark", "data", "daughter", "day",
            "dead", "deal", "death", "debate", "decade", "decide", "decision", "deep", "deer", "defeat", "degree", "democratic",
            "describe", "desert", "design", "desk", "despite", "detail", "determine", "develop", "development", "dictionary", "die", "difference",
            "each", "eagle", "ear", "early", "earth", "east", "easy", "eat", "economic", "economy", "edge", "education",
            "effect", "effort", "egg", "eight", "either", "election", "elephant", "eleven", "else", "email", "employee", "empty",
            "end", "energy", "engineer", "enjoy", "enough", "enter", "face", "fact", "factor", "factory", "fail", "fall",
            "family", "famous", "far", "farm", "farmer", "fast", "father", "fear", "federal", "feel", "feeling", "fence",
            "few", "field", "fight", "figure", "fill", "film", "final", "finally", "financial", "find", "fine", "finger",
            "game", "garden", "gas", "general", "generation", "geography", "get", "girl", "give", "glass", "glove", "go",
            "goal", "goat", "gold", "golf", "good", "goodbye", "government", "grade", "grammar", "grandfather", "grandmother", "grape",
            "grass", "grateful", "gray", "great", "green", "greeting", "hair", "half", "hand", "hang", "happen", "happy",
            "hard", "hardware", "hat", "hate", "have", "head", "health", "healthy", "hear", "heart", "heat", "heavy",
            "hello", "help", "her", "here", "herself", "hi", "high", "him", "himself", "his", "history", "hit",
            "ice", "idea", "identify", "image", "imagine", "impact", "important", "improve", "include", "including", "increase", "indeed",
            "indicate", "individual", "industry", "information", "inside", "instead", "institution", "insurance", "interest", "interesting", "international", "internet",
            "interview", "into", "introduce", "investment", "involve", "iron", "jacket", "jealous", "job", "join", "juice", "jump",
            "just", "keep", "key", "keyboard", "kid", "kind", "kitchen", "knee", "know", "knowledge", "lake", "lamp",
            "land", "language", "large", "last", "late", "later", "laugh", "law", "lawyer", "lay", "lead", "leader",
            "leaf", "learn", "least", "leather", "leave", "left", "leg", "legal", "less", "lesson", "let", "letter",
            "level", "library", "lie", "life", "machine", "magazine", "main", "maintain", "major", "majority", "make", "man",
            "manage", "management", "manager", "mango", "many", "map", "mark", "market", "marriage", "material", "math", "matter",
            "may", "maybe", "mean", "meaning", "measure", "meat", "media", "medical", "meet", "meeting", "name", "narrow",
            "nation", "national", "natural", "nature", "near", "nearly", "necessary", "neck", "need", "nervous", "network", "never",
            "new", "news", "newspaper", "next", "nice", "night", "nine", "no", "none", "noodle", "nor", "north",
            "nose", "not", "note", "nothing", "occur", "ocean", "off", "offer", "office", "officer", "official", "often",
            "oil", "old", "once", "one", "only", "onto", "open", "operation", "opinion", "opportunity", "option", "orange",
            "order", "organization", "other", "others", "our", "out", "outside", "over", "owl", "own", "page", "pain",
            "paint", "painting", "pants", "paper", "pardon", "parent", "park", "part", "participant", "particular", "particularly", "partner",
            "party", "pass", "past", "patient", "pattern", "pay", "peace", "pen", "pencil", "people", "pepper", "per",
            "perform", "performance", "perhaps", "period", "quality", "question", "quick", "quickly", "quiet", "quite", "rabbit", "race",
            "radio", "rain", "rainy", "raise", "range", "rare", "rate", "rather", "reach", "read", "ready", "real",
            "reality", "realize", "really", "reason", "receive", "recent", "recently", "recognize", "record", "red", "reduce", "reflect",
            "region", "relate", "relationship", "religion", "sad", "safe", "salad", "salt", "same", "sand", "sandwich", "save",
            "say", "scarf", "scene", "school", "science", "scientist", "score", "screen", "sea", "season", "seat", "second",
            "section", "security", "see", "seek", "seem", "sell", "send", "senior", "sense", "sentence", "table", "take",
            "talk", "tall", "task", "tax", "taxi", "tea", "teach", "teacher", "team", "technology", "teeth", "television",
            "tell", "temple", "ten", "tend", "tennis", "term", "test", "than", "thank", "thanks", "that", "the",
            "theater", "their", "them", "ugly", "uncle", "under", "understand", "unit", "university", "until", "up", "upon",
            "us", "use", "usually", "value", "various", "vegetable", "very", "victim", "victory", "view", "village", "violence",
            "visit", "voice", "volleyball", "vote", "wait", "walk", "wall", "want", "war", "warm", "wash", "watch",
            "water", "way", "we", "weak", "weapon", "wear", "website", "week", "weight", "welcome", "well", "west",
            "western", "wet", "whale", "what", "whatever", "when", "where", "whether", "which", "yard", "yeah", "year",
            "yellow", "yes", "yesterday", "yet", "you", "young", "your", "yourself", "zebra", "zero", "zone", "zoo"
        ];

        let currentAudioUrl = null;
        const CACHE_KEY = 'bahasaku_dictionary_cache_v3'; // Cache key diperbarui ke V3 untuk menghapus sisa error lama

        // Render A-Z Dictionary pada saat halaman dimuat
        function renderDictionary(filterText = "") {
            const wrapper = document.getElementById('dictionary-wrapper');
            wrapper.innerHTML = ''; 

            let filteredWords = localWordBank.filter(w => w.toLowerCase().includes(filterText.toLowerCase()));
            filteredWords.sort();

            document.getElementById('empty-msg').style.display = filteredWords.length === 0 ? 'block' : 'none';

            const grouped = {};
            filteredWords.forEach(word => {
                const firstLetter = word.charAt(0).toUpperCase();
                if (!grouped[firstLetter]) grouped[firstLetter] = [];
                grouped[firstLetter].push(word);
            });

            for (const letter in grouped) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'letter-group';
                
                let html = `<div class="letter-title">${letter}</div><div class="word-grid">`;
                grouped[letter].forEach(word => {
                    html += `<div class="word-box" data-word="${escapeHtml(word)}">${escapeHtml(word)}</div>`;
                });
                html += `</div>`;
                
                groupDiv.innerHTML = html;
                wrapper.appendChild(groupDiv);
            }
        }

        // Klik kata pada grid
        document.getElementById('dictionary-wrapper').addEventListener('click', function(event) {
            const box = event.target.closest('.word-box');
            if (!box) return;

            const word = box.dataset.word;
            clickWordBox(word);
        });

        window.onload = () => {
            renderDictionary();
            document.getElementById('stats-badge').innerText = `Tersedia ${localWordBank.length} Kata Tersortir A-Z (Pencarian Online Tanpa Batas)`;
        };

        // Live Search
        document.getElementById("search-input").addEventListener("input", function(e) {
            renderDictionary(e.target.value);
        });

        // Trigger Pencarian API
        document.getElementById("search-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                triggerSearch();
            }
        });

        function clickWordBox(word) {
            document.getElementById('search-input').value = word;
            triggerSearch(word);
        }

        function closeResult() {
            document.getElementById('result-container').style.display = 'none';
        }

        // =========================================================================
        // FUNGSI PENCARIAN KATA (API DICTIONARY)
        // =========================================================================
        async function triggerSearch(selectedWord = null) {
            const inputWord = selectedWord || document.getElementById('search-input').value;
            const word = inputWord.trim().toLowerCase();
            if (!word) return;

            document.getElementById('search-input').value = word;
            document.getElementById('scroll-area').scrollTo({ top: 0, behavior: 'smooth' });

            document.getElementById('result-container').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                // 1. Cek cache
                const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
                if (cache[word]) {
                    renderWordResult(cache[word]);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('result-container').style.display = 'flex';
                    return;
                }

                // 2. API Dictionary Bahasa Inggris
                const dictResponse = await fetch(
                    `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`
                );

                if (!dictResponse.ok) {
                    throw new Error(`Kata "${word}" tidak ditemukan di database kamus.`);
                }

                const dictData = await dictResponse.json();
                const result = dictData[0];

                // 3. Terjemahkan kata utama (Aman dari error fatal jika limit API tercapai)
                const translation = await translateText(word);

                // 4. Kumpulkan contoh kalimat
                const examples = [];
                result.meanings.forEach(meaning => {
                    meaning.definitions.forEach(def => {
                        if (def.example && !examples.includes(def.example)) {
                            examples.push(def.example);
                        }
                    });
                });

                const limitedExamples = examples.slice(0, 3);

                // 5. Terjemahkan contoh kalimat
                const translatedExamples = [];
                for (const example of limitedExamples) {
                    const translatedExample = await translateText(example);
                    translatedExamples.push({
                        english: example,
                        indonesian: translatedExample
                    });
                }

                // 6. Audio
                const phoneticObj = result.phonetics?.find(
                    p => p.audio && p.audio.length > 0
                );

                // 7. Bentuk Data
                const wordData = {
                    word: result.word || word,
                    phonetic: result.phonetic || '',
                    translation: translation,
                    meanings: result.meanings || [],
                    examples: translatedExamples,
                    audio: phoneticObj ? phoneticObj.audio : null,
                    savedAt: Date.now()
                };

                // 8. Simpan ke Cache
                cache[word] = wordData;
                localStorage.setItem(CACHE_KEY, JSON.stringify(cache));

                // 9. Render
                renderWordResult(wordData);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('result-container').style.display = 'flex';

            } catch (error) {
                console.error(error);
                document.getElementById('loading').style.display = 'none';
                alert(`Maaf, data kata "${word}" tidak ditemukan. Pastikan kata bahasa Inggrisnya benar dan koneksi internet aktif.`);
            }
        }

        // =========================================================================
        // BUG FIX: TRANSLATE TEXT FAIL-SAFE (Cegah error saat limit API)
        // =========================================================================
        async function translateText(text) {
            try {
                // Penambahan email dummy membantu menghindari blokir cepat dari API gratis MyMemory
                const response = await fetch(
                    `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|id&de=cs.bahasaku@gmail.com`
                );

                if (!response.ok) {
                    console.warn("Translation API gagal merespons.");
                    return "(Terjemahan sementara tidak tersedia)";
                }

                const data = await response.json();
                
                // MyMemory akan memberikan responseStatus 429 jika melampaui limit pencarian harian
                if (data && data.responseStatus === 429) {
                     return "(Limit terjemahan harian habis)";
                }

                let translated = data?.responseData?.translatedText || '';

                if (!translated || translated.trim().toLowerCase() === text.trim().toLowerCase()) {
                    translated = "(Terjemahan tidak tersedia)";
                }

                return translated;
                
            } catch (error) {
                // Error akan "ditelan" di sini, sehingga proses pencarian dictionary tetap berlanjut
                console.error("Error pada translateText:", error);
                return "(Koneksi terjemahan bermasalah)";
            }
        }

        // =========================================================================
        // RENDER HASIL KE HTML
        // =========================================================================
        function renderWordResult(data) {
            document.getElementById('word-title').innerText = data.word;
            document.getElementById('word-phonetic').innerText = data.phonetic || '';
            document.getElementById('word-translation').innerText = data.translation || "(Terjemahan tidak tersedia)";

            currentAudioUrl = data.audio || null;
            const btnAudio = document.getElementById('btn-audio');

            if (currentAudioUrl) {
                btnAudio.style.display = 'flex';
            } else {
                btnAudio.style.display = 'none';
            }

            const meaningsContainer = document.getElementById('meanings-container');
            meaningsContainer.innerHTML = '';

            data.meanings.forEach(meaning => {
                const pos = meaning.partOfSpeech || 'Meaning';
                let html = `<div class="part-of-speech">${pos}</div>`;
                const defs = meaning.definitions.slice(0, 2);

                defs.forEach(def => {
                    html += `
                        <div class="definition-item">
                            <div class="def-text">🇬🇧 ${escapeHtml(def.definition)}</div>
                        </div>
                    `;
                });
                meaningsContainer.innerHTML += html;
            });

            if (data.examples && data.examples.length > 0) {
                let exampleHtml = `
                    <div class="meaning-section">
                        <div class="part-of-speech">📚 Contoh Penggunaan</div>
                `;
                data.examples.forEach(example => {
                    exampleHtml += `
                        <div class="definition-item">
                            <div class="def-example">
                                🇬🇧 "${escapeHtml(example.english)}"
                            </div>
                            <div style="margin-top:8px; color:var(--text-dark);">
                                🇮🇩 ${escapeHtml(example.indonesian || 'Terjemahan contoh tidak tersedia.')}
                            </div>
                        </div>
                    `;
                });
                exampleHtml += `</div>`;
                meaningsContainer.innerHTML += exampleHtml;
            } else {
                meaningsContainer.innerHTML += `
                    <div class="meaning-section">
                        <div class="part-of-speech">📚 Contoh Penggunaan</div>
                        <div class="definition-item">
                            <div class="def-example">
                                Belum ada contoh kalimat dari database untuk kata ini.
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function playAudio() {
            if (currentAudioUrl) {
                const audio = new Audio(currentAudioUrl);
                audio.play();
            }
        }
    </script>
</body>
</html>
